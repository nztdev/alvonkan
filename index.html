<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Al Von Kan: Shadow Survivors</title>
<style>
:root{--void:#04020a;--fg:#e9e4f0;--dim:#9ca3af;--mana:#a78bfa;--gold:#fbbf24;--hp:#ef4444;--xp:#34d399;color-scheme:dark;box-sizing:border-box}
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:var(--void);color:var(--fg);font-family:Georgia,'Times New Roman',serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:2px;text-transform:uppercase}
.bar{height:10px;background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;width:100%;transition:width .15s}
#hpb{background:linear-gradient(90deg,#7f1d1d,var(--hp))}
#xpb{background:linear-gradient(90deg,#065f46,var(--xp));width:0}
#time{font-size:22px;color:var(--gold);text-shadow:0 0 14px #d97706}
#flash{position:fixed;inset:0;background:#8b0000;opacity:0;pointer-events:none;transition:opacity .2s}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(4,2,10,.88);text-align:center;padding:20px;overflow-y:auto}

.sub{font-size:12px;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
p.s{max-width:460px;font-style:italic;color:var(--dim);line-height:1.6;font-size:14px}
button{font:inherit;font-size:13px;letter-spacing:3px;text-transform:uppercase;padding:12px 26px;background:transparent;border:1px solid #5b21b6;color:var(--mana);cursor:pointer;touch-action:manipulation}

button.go{border-color:var(--gold);color:var(--gold)}
.tiers{display:flex;gap:6px}.tiers button{padding:8px 14px;font-size:11px}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.card{width:190px;padding:16px 12px;border:1px solid #5b21b6;background:rgba(20,10,40,.9);cursor:pointer;letter-spacing:0;text-transform:none}
.card b{display:block;color:var(--gold);font-size:15px;margin-bottom:4px}.card em{color:var(--mana);font-size:11px;display:block;margin-bottom:6px}.card span{color:var(--dim);font-size:12px}

</style>
</head>

<div id="hud">

  <div class="bar"><i id="hpb"></i></div>
  <div class="bar" style="height:7px"><i id="xpb"></i></div>

    for (const e of enemies) if (e.hp > 0 && e.dir.angleTo(p.dir) * R < 2 && !p.hit?.includes(e)) { hurt(e, 9 * (1 + .25 * W.dagger)); (p.hit = p.hit || []).push(e); if (--p.pierce <= 0) { p.life = 0; break; } }
    if (p.life <= 0) projs.splice(i, 1);
  }
  projs.forEach((p, i) => putB(dmesh, i, p.dir, 1.2, p.vel)); dmesh.count = projs.length; dmesh.instanceMatrix.needsUpdate = true;

  // Shadow Wolves
  while (wolves.length < Math.min(W.wolf, 6)) wolves.push({ dir: P.dir.clone(), f: P.fwd.clone(), cd: 0 }); wmesh.begin();
  wolves.forEach((w, i) => {
    w.cd -= dt; const t = nearest(w.dir); const goal = t && t.a < .9 ? t.e.dir : P.dir;
    tangent(w.dir, goal, _t); w.f.lerp(_t, .3).normalize(); const d = w.dir.angleTo(goal) * R;
    if (d > (t && t.a < .9 ? 1.6 : 7)) step(w.dir, _t, 26 * dt);
    if (t && t.a < .9 && d < 2.4 && w.cd <= 0) { hurt(t.e, 14 * (1 + .25 * W.wolf)); w.cd = .45; }
    w.f.addScaledVector(w.dir, -w.f.dot(w.dir)).normalize(); wmesh.add(w.dir, w.f, 1, i * 2.1, SHC);
  });
  wmesh.end();

  // deaths
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].hp <= 0) { const e = enemies[i]; gems.push({ dir: e.dir.clone(), xp: TYPES[e.ty].xp }); kills++; enemies[i] = enemies[enemies.length - 1]; enemies.pop(); }

  // gems
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i], d = g.dir.angleTo(P.dir) * R;
    if (d < P.mag) { tangent(g.dir, P.dir, _t); step(g.dir, _t, (28 + (P.mag - d) * 3) * dt); }
    if (d < 1.8) { P.xp += g.xp; gems.splice(i, 1); doneTip('gem'); checkLevel(); }
  }
  if (gems.length > 590) gems.splice(0, gems.length - 590);

  // tutorial prompts: contextual, non-blocking, one at a time
  if (tipId) { tipTimer -= dt; if (tipTimer <= 0) hideTip(); }
  if (tipId === 'move' && mag > .05 && (moved += dt) > .8) hideTip();
  if (time < 1) showTip('move', 'Drag anywhere, or use WASD, to move', 15);
  else if (enemies.length && time > 2) showTip('auto', 'Your shadows fight for you automatically. Keep moving and stay out of the swarm.', 6);
  if (gems.length) showTip('gem', 'Walk over glowing soul gems to gain XP and level up', 12);
  if (P.hp < P.max * .4) showTip('low', 'Low health! Enemies chase you, so keep circling the planet to kite them.', 6);

  if (demo) P.hp = P.max;
  if (P.hp <= 0) end(false); else if (time >= 600) end(true);
}

function render() {
  // enemies
  EM.forEach(h => h.begin());
  enemies.forEach((e, i) => { EM[e.ty].add(e.dir, e.f, SCL[e.ty] * (e.flash > 0 ? 1.2 : 1), e.ph); put(eshad, i, e.dir, .06, SCL[e.ty] * 1.2, 1, SCL[e.ty] * 1.2); });
  EM.forEach(h => h.end());
  eshad.count = enemies.length; eshad.instanceMatrix.needsUpdate = true;
  
  const bob = Math.sin(performance.now() * .006) * .15;
  gems.forEach((g, i) => put(gmesh, i, g.dir, 1 + bob, 1, 1.4, 1)); gmesh.count = gems.length; gmesh.instanceMatrix.needsUpdate = true;
  // player
  _r.crossVectors(P.dir, P.face); _m.makeBasis(_r, P.dir, P.face); pm.quaternion.setFromRotationMatrix(_m); pm.position.copy(P.dir).multiplyScalar(R);
  const u = pm.userData, tt = performance.now() * .001; u.wb += ((P.mv > .05 ? 1 : 0) - u.wb) * .2; u.ph += (P.mv || 0) * (demo ? .6 : .3);
  const sw = Math.sin(u.ph) * u.wb; u.footL.position.z = .1 + sw * .6; u.footR.position.z = .1 - sw * .6; u.footL.position.y = .15 + Math.max(0, sw) * .25; u.footR.position.y = .15 + Math.max(0, -sw) * .25;
  u.armL.rotation.x = demo ? -2.5 + Math.sin(u.ph * 1.7) * .6 : -sw * .8; u.armR.rotation.x = demo ? -2.5 - Math.sin(u.ph * 1.7) * .6 : -.9; u.cloak.rotation.x = -(.12 + u.wb * .3 + Math.sin(tt * 2) * .04); pm.position.addScaledVector(P.dir, Math.abs(sw) * .12 + Math.sin(tt * 2) * .04);
  u.orb.scale.setScalar(1 + Math.sin(tt * 5) * .18); u.light.intensity = 1.4 + Math.sin(tt * 5) * .4; UT.value = tt; sunL.target.position.copy(pm.position); sunL.position.copy(pm.position).addScaledVector(P.dir, 70).addScaledVector(RT.crossVectors(P.fwd, P.dir), 35).addScaledVector(P.fwd, -20); if (window.animWorld) animWorld(tt);
  // camera
  camera.up.copy(P.dir); camera.position.copy(P.dir).multiplyScalar(R + 40).addScaledVector(P.fwd, -26);
  camera.lookAt(_p.copy(P.dir).multiplyScalar(R).addScaledVector(P.fwd, 6));
  // HUD
  $('hpb').style.width = Math.max(0, P.hp / P.max * 100) + '%'; $('xpb').style.width = P.xp / need() * 100 + '%';
  $('time').textContent = fmt(time); $('kills').textContent = 'Kills ' + kills; $('lvl').textContent = 'Lv ' + P.lvl;
  $('loadout').textContent = `Bone ${W.orbit} · Raiders ${W.dagger} · Wolves ${W.wolf}`;
}

let last = performance.now(), menuAng = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (state === 'play') { update(dt); render(); }
  else if (state === 'pause' || state === 'tip') render();
  else if (demo) { update(dt); render(); demoCam(); }
  else {
    menuAng += dt * .08; pm.visible = false; camera.up.set(0, 1, 0);
    camera.position.set(Math.sin(menuAng) * 200, 70, Math.cos(menuAng) * 200); camera.lookAt(0, 0, 0);
    ehead.count = eshad.count = emesh.count = eeyes.count = gmesh.count = omesh.count = dmesh.count = wmesh.count = 0;
  }
  if (state === 'play') pm.visible = true;
  renderer.render(scene, camera);
}
resize(); requestAnimationFrame(loop);
</script>
